[project]
name = "motiva-field-api"
version = "0.1.0"
description = "API local de orquestracao do Motiva Field"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.6",
  "google-genai>=1.0",
  "pillow>=10.0",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
