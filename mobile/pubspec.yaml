name: motiva_field
description: App do operador de campo do MOTIVA-FIELD. Leva o operador ate o ponto e comprova a execucao da rocada.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  geolocator: ^14.1.2
  http: ^1.2.2
  http_parser: ^4.1.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/foto-regua-validada.png
