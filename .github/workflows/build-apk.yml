name: Build APK Sprint 4

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versões
        run: |
          flutter --version
          java -version

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Preparar nome final
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/motiva-field-sprint4.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: motiva-field-sprint4
          path: mobile/build/app/outputs/flutter-apk/motiva-field-sprint4.apk
          if-no-files-found: error

      - name: Publicar APK na release Sprint 4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sprint4-final
          name: Motiva Field — Sprint 4
          body: |
            APK final da Sprint 4 do projeto Motiva Field.
            Gerado automaticamente a partir da branch main após análise estática e testes.
          files: mobile/build/app/outputs/flutter-apk/motiva-field-sprint4.apk
          overwrite_files: true
